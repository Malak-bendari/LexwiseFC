<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - LexWise</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0f1a, #060b14);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(13, 20, 33, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 170, 0.2);
            border-radius: 28px;
            padding: 40px;
            max-width: 450px;
            width: 90%;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #e8ecf1;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        .subtitle {
            color: #8b95a5;
            margin-bottom: 30px;
            font-size: 0.85rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #8b95a5;
            font-size: 0.7rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            background: #060b14;
            border: 1px solid rgba(0, 212, 170, 0.2);
            border-radius: 10px;
            color: #e8ecf1;
            font-size: 0.9rem;
            outline: none;
        }
        input:focus {
            border-color: #00d4aa;
            box-shadow: 0 0 0 2px rgba(0, 212, 170, 0.1);
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d4aa, #00d4ff);
            color: #060b14;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(0, 212, 170, 0.3);
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.8rem;
        }
        .error { background: rgba(255, 71, 87, 0.2); color: #ff4757; }
        .success { background: rgba(46, 213, 115, 0.2); color: #2ed573; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Reset Password</h1>
        <p class="subtitle">Enter your new password below</p>
        
        <div id="messageDiv"></div>
        
        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password">
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm new password">
        </div>
        
        <button onclick="resetPassword()">Reset Password</button>
    </div>

    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        
        async function resetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('messageDiv');
            
            if (!newPassword || !confirmPassword) {
                messageDiv.innerHTML = '<div class="message error">Please fill in both fields</div>';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                messageDiv.innerHTML = '<div class="message error">Passwords do not match</div>';
                return;
            }
            
            if (newPassword.length < 8) {
                messageDiv.innerHTML = '<div class="message error">Password must be at least 8 characters</div>';
                return;
            }
            
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    messageDiv.innerHTML = '<div class="message success">✅ Password reset successful! Redirecting to login...</div>';
                    setTimeout(() => {
                        window.location.href = 'http://127.0.0.1:5000';
                    }, 2000);
                } else {
                    messageDiv.innerHTML = `<div class="message error">❌ ${data.error}</div>`;
                }
            } catch(e) {
                messageDiv.innerHTML = '<div class="message error">Something went wrong. Please try again.</div>';
            }
        }
    </script>
</body>
</html>
